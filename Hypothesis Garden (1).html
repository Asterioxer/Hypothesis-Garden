</style></head><body>
<header><b>🌱 Hypothesis Garden</b><nav id="nav"></nav><button id="snd" onclick="setSnd(!hum)">♪ Sound off</button></header><main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),f=(x,d=2)=>x.toFixed(d),pc=x=>f(x*100,1)+'%',pf=p=>p<.001?p.toExponential(1):f(p,3),avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11),gauss=(r=R)=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*r())};
const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))},Phi=z=>.5*(1+erf(z/Math.SQRT2));
const PP={P1:['HITL Survey','2108.00941'],P2:['Agentic AI Taxonomy','2601.12560'],P3:['HLER Economic Research','2603.07444'],P4:['Human-on-the-Loop Discovery','2606.19812'],P5:['Agents Push Humans Out','2608.23642']};
const tag=(...k)=>`<div class="chips">${k.map(x=>`<span class="chip" title="arXiv ${PP[x[0]][1]}">${x[0]} · ${PP[x[0]][0]} <i>${x[1]}</i></span>`).join('')}</div>`;
const G={minN:800,alpha:.05};
/* ---- synthetic panel dataset (seeded, computed live) ---- */
const V=['education','income','health','crime','unemployment','commute','rainfall'],MISS=[.03,.12,.08,.35,.04,.52,.02],N=1500,D=[];
for(let i=0;i<N;i++){const e=gauss(),inc=.6*e+.8*gauss(),h=.4*inc+.3*e+.8*gauss(),c=-.3*inc+gauss(),u=-.4*e+gauss(),m=.2*inc+gauss();D.push([e,inc,h,c,u,m,gauss()].map((x,j)=>R()<MISS[j]?null:x))}
function corr(a,b){let n=0,sa=0,sb=0;for(const r of D)if(r[a]!=null&&r[b]!=null){n++;sa+=r[a];sb+=r[b]}const ma=sa/n,mb=sb/n;let c=0,va=0,vb=0;for(const r of D)if(r[a]!=null&&r[b]!=null){const x=r[a]-ma,y=r[b]-mb;c+=x*y;va+=x*x;vb+=y*y}const rr=c/Math.sqrt(va*vb);return{a,b,r:rr,n,p:Math.max(1e-12,2*(1-Phi(Math.abs(Math.atanh(rr)*Math.sqrt(n-3)))))}}
const H=[];for(let a=0;a<7;a++)for(let b=a+1;b<7;b++)H.push(corr(a,b));
(()=>{const m=H.length,o=[...H].sort((x,y)=>x.p-y.p);let q=1;for(let i=m-1;i>=0;i--){q=Math.min(q,o[i].p*m/(i+1));o[i].q=q}H.forEach(h=>h.bf=Math.min(1,h.p*m))})();
const st=h=>h.q<G.alpha?'sig':h.p<G.alpha?'nom':'ns',feas=h=>h.n>=G.minN,name=h=>V[h.a]+' → '+V[h.b],OFF=9;
const STX={sig:'significant after BH correction',nom:'nominal only (fails correction)',ns:'not significant'};
/* ---- router ---- */
let raf=0,rend=null;const PG={garden:['Garden',pgGarden],profile:['Profiler',pgProfile],planner:['Planner Lab',pgPlanner],review:['Review Board',pgReview],human:['Human Loop',pgHuman],audit:['Audit',pgAudit],papers:['Papers',pgPapers]};
function route(){const k=PG[location.hash.slice(2)]?location.hash.slice(2):'garden';cancelAnimationFrame(raf);clearInterval(window.iv);window.iv=0;if(rend){rend.dispose();rend=null}
$('#nav').innerHTML=Object.entries(PG).map(([x,v])=>`<a href="#/${x}" class="${x==k?'on':''}">${v[0]}</a>`).join('');PG[k][1]();scrollTo(0,0)}
addEventListener('hashchange',route);
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function plot(c,ser,lo,xl){const x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.font='11px sans-serif';for(let i=0;i<=4;i++){const y=10+(h-34)*i/4;x.strokeStyle=col('--bd');x.beginPath();x.moveTo(34,y);x.lineTo(w-6,y);x.stroke();x.fillStyle=col('--mu');x.fillText(Math.round((1-i/4*(1-lo))*100)+'%',0,y+4)}
ser.forEach(s=>{x.strokeStyle=s.c;x.lineWidth=2;x.beginPath();s.d.forEach((v,i)=>{const px=34+(w-40)*i/(s.d.length-1),py=10+(h-34)*(1-(v-lo)/(1-lo));i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});
x.fillStyle=col('--mu');x.fillText(xl,34,h-4);ser.forEach((s,i)=>{x.fillStyle=s.c;x.fillText('■ '+s.n,w-170+i*0,h-4-(ser.length-1-i)*0);});}
/* ---- 1 GARDEN ---- */
function pgGarden(){const fe=H.filter(feas),wl=h=>h.n<G.minN*1.25;
$('#app').innerHTML=tag(['P3','dataset-aware hypotheses §4'],['P2','planner loop branches §2.2'],['P4','wilt = low confidence'])+`<h1>Hypothesis Garden</h1><p class="mu">Terrain ridges = the 7 dataset columns (height = completeness): ${V.join(' · ')}. Each plant is a column pair that passed the profiler gate (n ≥ ${G.minN}); stem height = |r|. Drag to orbit, scroll to zoom, click a plant.</p>
<div class="grid"><div class="cv" style="position:relative"><canvas id="c3"></canvas><div id="tip" class="tip"></div><div class="hud" id="hud"></div></div><div><div class="kp"><div><b>${fe.length}/${H.length}</b><span>pairs planted (gate)</span></div><div><b>${fe.filter(h=>st(h)=='sig').length}</b><span>survive BH @ α=${G.alpha}</span></div><div><b>${fe.filter(wl).length}</b><span>wilted (low n)</span></div></div>
<div class="card" id="info">Select a plant to inspect it.</div><div class="card lg"><span><i style="background:#4ade80"></i>BH-significant</span><span><i style="background:#f0b45a"></i>nominal only</span><span><i style="background:#9aa59f"></i>null</span><p class="mu" style="margin:6px 0 0">Tilted = wilted: n under 125% of the gate. Change the gate on the Profiler page and the garden regrows.</p></div></div></div>`;
const cv=$('#c3'),w=cv.parentNode.clientWidth,h=Math.max(420,Math.min(640,innerHeight*.68)),RM=matchMedia('(prefers-reduced-motion:reduce)').matches,night=col('--bg')<'#8',bgc=night?0x08110c:0xdfe9e0;
rend=new THREE.WebGLRenderer({canvas:cv,antialias:true});rend.setSize(w,h);rend.setPixelRatio(Math.min(2,devicePixelRatio));rend.setClearColor(bgc);
const sc=new THREE.Scene();sc.fog=new THREE.FogExp2(bgc,night?.014:.009);const cam=new THREE.PerspectiveCamera(50,w/h,.1,300);
sc.add(new THREE.HemisphereLight(night?0x78b595:0xffffff,0x14231b,night?.75:.8));const dl=new THREE.DirectionalLight(night?0xb4cfff:0xfff2d0,.7);dl.position.set(20,40,10);sc.add(dl);
const ht=(x,z)=>{let y=0;V.forEach((_,j)=>{const dx=x-(j-3)*8;y+=5*(1-MISS[j])*Math.exp(-dx*dx/9)*(1+.25*Math.sin(z*.3+j))});return y+.4*Math.sin(x*.5)*Math.cos(z*.4)};
const g=new THREE.PlaneGeometry(64,50,64,50);g.rotateX(-Math.PI/2);const ps=g.attributes.position,cl=[];for(let i=0;i<ps.count;i++){const y=ht(ps.getX(i),ps.getZ(i));ps.setY(i,y);const t=Math.min(1,y/5);cl.push(.12+.2*t,.3+.45*t,.2+.1*t)}
g.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));g.computeVertexNormals();sc.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));
V.forEach((v,j)=>{const c2=document.createElement('canvas');c2.width=256;c2.height=64;const x=c2.getContext('2d');x.font='600 30px Fraunces,Georgia,serif';x.textAlign='center';x.fillStyle=night?'#bfe9d0':'#14231b';x.fillText(v,128,40);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c2),transparent:true,depthWrite:false,fog:false}));sp.scale.set(8,2,1);sp.position.set((j-3)*8,9.5,-4);sc.add(sp)});
const FN=160,fp=new Float32Array(FN*3),fs=[];for(let i=0;i<FN;i++){fp.set([(Math.random()-.5)*60,2+Math.random()*12,(Math.random()-.5)*46],i*3);fs.push(Math.random()*6)}
const bp=fp.slice(),fg=new THREE.BufferGeometry();fg.setAttribute('position',new THREE.BufferAttribute(fp,3));sc.add(new THREE.Points(fg,new THREE.PointsMaterial({color:night?0xd9ff8a:0xffffff,size:night?.6:.3,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false})));
const pl=[],C={sig:0x4ade80,nom:0xf0b45a,ns:0x9aa59f},P0=performance.now();
fe.forEach((hh,i)=>{const x=((hh.a+hh.b)/2-3)*8,z=(((hh.a*3+hh.b*5)%9)-4)*4.5+(hh.b-hh.a)*.35,sh=1+Math.abs(hh.r)*9,gr=new THREE.Group(),c=C[st(hh)];
const s=new THREE.Mesh(new THREE.CylinderGeometry(.1,.16,sh,6),new THREE.MeshLambertMaterial({color:0x2f6b45}));s.position.y=sh/2;
const t=new THREE.Mesh(new THREE.SphereGeometry(.55+.4*Math.abs(hh.r),12,10),new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.3}));t.position.y=sh;
const hl=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false}));hl.scale.setScalar(st(hh)=='sig'?2.6:1.6);hl.position.y=sh;
gr.add(s,t,hl);gr.position.set(x,ht(x,z),z);gr.userData={h:hh,hl};if(wl(hh))gr.rotation.z=.45;sc.add(gr);pl.push(gr)});
const rc=new THREE.Raycaster(),look=new THREE.Vector3(0,3,0),dest=look.clone();let th=.6,ph=.9,d=75,dT=62,sel=null,dn=null,mv=0,last=0;
function show(o){sel=o;dest.copy(o.position);dT=34;const q=o.userData.h;chime(st(q)=='sig'?523+Math.abs(q.r)*400:262+Math.abs(q.r)*200);
$('#info').innerHTML=`<b>${name(q)}</b><br>r = ${f(q.r,3)} · n = ${q.n}<br>raw p = ${pf(q.p)} (rank ${H.filter(x=>x.p<q.p).length+1} of ${H.length})<br>Bonferroni p = ${pf(q.bf)} · BH q = ${pf(q.q)}<br><b>${STX[st(q)]}</b>${wl(q)?'<br><span class="wn">Wilted: low sample support</span>':''}${q.a==6||q.b==6?'<br><span class="wn">Canary pair: rainfall is simulated pure noise</span>':''}`}
const pick=e=>{const r=cv.getBoundingClientRect();rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height)*2+1},cam);const hit=rc.intersectObjects(pl,true)[0];if(!hit)return null;let o=hit.object;while(!o.userData.h)o=o.parent;return o};
cv.onpointerdown=e=>{dn=[e.clientX,e.clientY];mv=0;last=performance.now();cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{last=performance.now();const tp=$('#tip');if(dn){const dx=e.clientX-dn[0],dy=e.clientY-dn[1];mv+=Math.abs(dx)+Math.abs(dy);th-=dx*.006;ph=Math.max(.25,Math.min(1.45,ph-dy*.006));dn=[e.clientX,e.clientY];tp.style.opacity=0;return}
const o=pick(e);if(o){const q=o.userData.h,r=cv.getBoundingClientRect();tp.textContent=name(q)+' · r '+f(q.r,2);tp.style.left=e.clientX-r.left+12+'px';tp.style.top=e.clientY-r.top-8+'px';tp.style.opacity=1;cv.style.cursor='pointer'}else{tp.style.opacity=0;cv.style.cursor='grab'}};
cv.onpointerup=e=>{dn=null;if(mv<5){const o=pick(e);if(o)show(o)}};
cv.onwheel=e=>{e.preventDefault();dT=Math.max(20,Math.min(100,dT+e.deltaY*.05))};
const sg=pl.filter(p=>st(p.userData.h)=='sig');let ti=0;$('#hud').innerHTML=`<span>${pl.length} plants · ${sg.length} survive correction · drag, scroll, hover</span>${sg.length?'<button id="tr1">Start tour</button>':''}`;
if(sg.length)$('#tr1').onclick=function(){if(window.iv){clearInterval(window.iv);window.iv=0;this.textContent='Start tour';return}const go=()=>show(sg[ti++%sg.length]);go();window.iv=setInterval(go,4200);this.textContent='Stop tour'};
(function loop(t){raf=requestAnimationFrame(loop);
pl.forEach((p,i)=>{const u=RM?1:Math.min(1,Math.max(0,(t-P0-i*90)/1400)),e=1-Math.pow(1-u,3);p.scale.setScalar(Math.max(.001,e)*(p==sel?1.35:1));p.rotation.x=Math.sin(t*.0012+i)*.05;p.userData.hl.material.opacity=.14+.06*Math.sin(t*.003+i)});
if(!RM){const a=fg.attributes.position;for(let i=0;i<FN;i++){a.setX(i,bp[i*3]+Math.cos(t*.0007+fs[i])*1.5);a.setY(i,bp[i*3+1]+Math.sin(t*.001+fs[i])*1.2)}a.needsUpdate=true;if(!dn&&t-last>3500)th+=.0012}
d+=(dT-d)*.05;look.lerp(dest,.06);cam.position.set(look.x+d*Math.sin(ph)*Math.sin(th),look.y+d*Math.cos(ph),look.z+d*Math.sin(ph)*Math.cos(th));cam.lookAt(look);rend.render(sc,cam)})(0)}
/* ---- 2 PROFILER ---- */
function pgProfile(){const cs=V.map((v,j)=>{const x=D.map(r=>r[j]).filter(y=>y!=null),m=avg(x);return{v,n:x.length,miss:1-x.length/N,m,sd:Math.sqrt(avg(x.map(y=>(y-m)**2)))}});
const get=(a,b)=>a==b?{r:1,n:cs[a].n}:H.find(h=>h.a==Math.min(a,b)&&h.b==Math.max(a,b));
let hm='<div></div>'+V.map(v=>`<div class="mu">${v.slice(0,6)}</div>`).join('');V.forEach((_,a)=>{hm+=`<div class="mu" style="text-align:right">${V[a]}</div>`;V.forEach((_,b)=>{const q=get(a,b);hm+=`<div title="n=${q.n}" style="background:${q.r>=0?'rgba(31,157,85,':'rgba(199,135,27,'}${Math.min(1,Math.abs(q.r)).toFixed(2)})">${f(q.r,2)}</div>`})});
$('#app').innerHTML=tag(['P3','audit agent → profile agent §4'])+`<h1>Data Profiler</h1><p class="mu">Synthetic panel: ${N} rows × ${V.length} columns, seeded and generated in your browser. Rainfall is pure noise by construction (a canary); crime and commute have heavy missingness.</p>
<div class="card tb"><table><tr><th>Column</th><th>Valid n</th><th>Missing</th><th></th><th>Mean</th><th>SD</th></tr>${cs.map(c=>`<tr><td>${c.v}</td><td>${c.n}</td><td>${pc(c.miss)}</td><td><div class="bar"><i style="width:${c.miss*100}%"></i></div></td><td>${f(c.m,2)}</td><td>${f(c.sd,2)}</td></tr>`).join('')}</table></div>
<h2>Pairwise correlation (pairwise-complete; hover for n)</h2><div class="card tb"><div class="hm">${hm}</div></div>
<h2>Feasibility gate</h2><div class="card"><label>Minimum pairwise n: <b id="gv"></b></label><input type="range" min="300" max="1400" step="50" value="${G.minN}" oninput="G.minN=+this.value;gate()"><div id="gate" class="kp" style="margin-top:10px"></div><p class="mu">The paper reports feasibility rising from 41% to 87% with dataset-aware generation. This demo uses a simpler proxy (testable = enough pairwise data), so its absolute numbers differ.</p></div>`;gate()}
function gate(){const fe=H.filter(feas).length,tot=H.length;$('#gv').textContent=G.minN;$('#gate').innerHTML=`<div><b>${pc(fe/(tot+OFF))}</b><span>unconstrained feasibility (${tot} pairs + ${OFF} off-schema ideas)</span></div><div><b>100%</b><span>gated feasibility (${fe} proposals)</span></div><div><b>${pc(fe/tot)}</b><span>coverage of pair space kept</span></div><div><b>${tot-fe}</b><span>pairs blocked</span></div>`}
/* ---- 3 PLANNER LAB ---- */
function sim(q,v){const r=rng(5),T=2000,o={ReAct:[0,0],ToT:[0,0],ReAcTree:[0,0]},att=n=>{for(let i=0;i<n;i++)if(r()>q)return 0;return 1};
for(let t=0;t<T;t++){const L=3+Math.floor(r()*6);o.ReAct[0]+=att(L);o.ReAct[1]+=350*L;
let ok=1;for(let s=0;s<L;s++){let c=0;for(let k=0;k<3;k++)c+=r()<q?1:0;if(!(c>0&&(r()<v||r()<c/3)))ok=0}o.ToT[0]+=ok;o.ToT[1]+=(1050+120)*L;
ok=1;let tk=0;for(let s=0;s<L;s+=3){const n=Math.min(3,L-s);tk+=80+350*n;let g=att(n);if(!g&&r()<.85){tk+=350*n;g=att(n)}if(!g)ok=0}o.ReAcTree[0]+=ok;o.ReAcTree[1]+=tk}
return Object.entries(o).map(([k,[a,t]])=>({k,acc:a/T,tok:t/T}))}
function pgPlanner(){$('#app').innerHTML=tag(['P2','Table 4: ReAct / ToT / ReAcTree'],['P3','question planner'])+`<h1>Planner Lab</h1><p class="mu">Monte-Carlo comparison of three planning topologies over 2,000 simulated tool-use tasks of 3–8 steps. Costs: 350 tokens per step; ToT samples 3 candidates plus 120 verifier tokens per step; ReAcTree splits into 3-step subtrees with one verified retry (85% failure detection). A simulation, not a live LLM benchmark.</p>
<div class="card"><label>Per-step success probability: <b id="qv"></b></label><input id="q" type="range" min="70" max="98" value="90" oninput="runP()"><label>Verifier accuracy (ToT): <b id="vv"></b></label><input id="v" type="range" min="50" max="100" value="80" oninput="runP()"></div><div class="card tb" id="pt"></div><div class="card" id="pb"></div>`;runP()}
function runP(){const q=$('#q').value/100,v=$('#v').value/100;$('#qv').textContent=pc(q);$('#vv').textContent=pc(v);const r=sim(q,v),mx=Math.max(...r.map(x=>x.tok));
$('#pt').innerHTML=`<table><tr><th>Planner</th><th>Task accuracy</th><th>Avg tokens/task</th><th>Accuracy per 1k tokens</th></tr>${r.map(x=>`<tr><td>${x.k}</td><td>${pc(x.acc)}</td><td>${Math.round(x.tok)}</td><td>${f(x.acc*100/(x.tok/1000),1)} pts</td></tr>`).join('')}</table>`;
$('#pb').innerHTML=r.map(x=>`<div>${x.k}<div class="bar"><i style="width:${x.acc*100}%;background:var(--ac)"></i></div><div class="bar" style="margin-top:3px"><i style="width:${x.tok/mx*100}%"></i></div></div>`).join('<br>')+'<p class="mu">Green = accuracy, amber = token cost (relative).</p>'}
/* ---- 4 REVIEW BOARD ---- */
const RD=['Novelty','Identification','Data quality','Clarity','Relevance'];
function pipe(h,th,gt){let s=[.9-.5*Math.abs(h.r),.35,Math.min(1,h.n/1350)-(MISS[h.a]+MISS[h.b])/4,.55,.5+.5*Math.min(1,Math.abs(h.r)*2)].map(x=>Math.max(.05,Math.min(.95,x)));const i0=[...s],its=[];
for(let i=0;i<8&&Math.min(...s)<th;i++){const k=s.indexOf(Math.min(...s));s[k]=Math.min(.95,s[k]+.12);its.push([i+1,RD[k],avg(s),Math.min(...s)])}
const r=rng(h.a*10+h.b+3),m=avg(s),vt=[0,0,0,0,0].map(()=>m+gauss(r)*.07>.6?1:0),p=avg(vt),e=p>0&&p<1?-p*Math.log2(p)-(1-p)*Math.log2(1-p):0;return{i0,s,its,vt,e,esc:e>gt}}
function pgReview(){const fe=H.filter(feas);$('#app').innerHTML=tag(['P3','reviewer rubric + revision loop §4'],['P4','uncertainty gate (self-consistency entropy)'])+`<h1>Review Board</h1>`+(fe.length?`<p class="mu">A reviewer agent scores a hypothesis on five rubric dimensions and keeps revising the weakest until all pass. Then 5 sampled reviewer votes give an entropy; high entropy escalates to a human. Scores are heuristic functions of r, n and missingness; revisions add +0.12 to the weakest dimension (a simulation of the loop, not text rewriting).</p>
<div class="card"><label>Hypothesis</label><select id="sel" onchange="runR()">${fe.map((h,i)=>`<option value="${i}">${name(h)} (r=${f(h.r,2)})</option>`).join('')}</select><label>Pass threshold: <b id="tv"></b></label><input id="th" type="range" min="50" max="90" value="70" oninput="runR()"><label>Escalation entropy threshold: <b id="gv2"></b> bits</label><input id="gt" type="range" min="0" max="100" value="50" oninput="runR()"></div>
<div class="grid"><div class="card"><canvas id="rd" width="320" height="300"></canvas></div><div class="card tb" id="ri"></div></div><div class="kp" id="rs"></div>`:'<p>No hypotheses pass the gate. Lower the minimum n on the Profiler page.</p>');if(fe.length)runR()}
function runR(){const fe=H.filter(feas),h=fe[+$('#sel').value],th=$('#th').value/100,gt=$('#gt').value/100;$('#tv').textContent=pc(th);$('#gv2').textContent=f(gt,2);const o=pipe(h,th,gt);
const c=$('#rd').getContext('2d'),cx=160,cy=150,rr=105;c.clearRect(0,0,320,300);c.font='12px sans-serif';
const pt=(v,i)=>[cx+Math.sin(i*1.2566)*rr*v,cy-Math.cos(i*1.2566)*rr*v];c.strokeStyle=col('--bd');[.25,.5,.75,1].forEach(l=>{c.beginPath();RD.forEach((_,i)=>c.lineTo(...pt(l,i)));c.closePath();c.stroke()});c.fillStyle=col('--mu');RD.forEach((d,i)=>{const[x,y]=pt(1.17,i);c.textAlign='center';c.fillText(d,x,y)});
[[o.i0,col('--mu')],[o.s,col('--ac')]].forEach(([s,k])=>{c.strokeStyle=k;c.lineWidth=2;c.beginPath();s.forEach((v,i)=>c.lineTo(...pt(v,i)));c.closePath();c.stroke()});
$('#ri').innerHTML=`<b>Revision loop</b> (grey = draft, green = final)<table><tr><th>Iter</th><th>Fixed</th><th>Mean</th><th>Min</th></tr>${o.its.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${f(x[2],3)}</td><td>${f(x[3],3)}</td></tr>`).join('')||'<tr><td colspan=4>Draft already passes.</td></tr>'}</table>`;
const all=fe.map(x=>pipe(x,th,gt)),n=all.filter(x=>x.esc).length;
$('#rs').innerHTML=`<div><b>${f(avg(o.i0),2)} → ${f(avg(o.s),2)}</b><span>mean rubric score</span></div><div><b>${o.vt.reduce((a,b)=>a+b)}/5</b><span>accept votes</span></div><div><b>${f(o.e,2)} bits</b><span>vote entropy</span></div><div><b>${o.esc?'ESCALATE':'AUTO'}</b><span>decision</span></div><div><b>${n}/${fe.length} (${pc(n/fe.length)})</b><span>hypotheses escalated overall</span></div>`}
/* ---- 5 HUMAN LOOP ---- */
const feat=p=>[1,p[0],p[1],p[0]*p[1],p[0]*p[0]+p[1]*p[1]];
function logit(X,y){const w=[0,0,0,0,0];for(let it=0;it<80;it++){const g=[0,0,0,0,0];X.forEach((x,i)=>{const p=1/(1+Math.exp(-x.reduce((s,v,k)=>s+v*w[k],0)));x.forEach((v,k)=>g[k]+=(p-y[i])*v)});w.forEach((_,k)=>w[k]-=1.2*g[k]/X.length)}return w}
function runAL(){const T=8,B=24,res={r:Array(B+1).fill(0),a:Array(B+1).fill(0)};for(let t=0;t<T;t++){const r=rng(100+t),P=[],Y=[];for(let i=0;i<500;i++){const p=[gauss(r)*1.3,gauss(r)*1.3];P.push(p);let l=p[0]*p[1]>0?1:0;if(r()<.08)l=1-l;Y.push(l)}
const tr=P.slice(0,300),ty=Y.slice(0,300),te=P.slice(300),tey=Y.slice(300);
for(const m of['r','a']){const idx=[...Array(12).keys()],used=new Set(idx);for(let k=0;k<=B;k++){const w=logit(idx.map(i=>feat(tr[i])),idx.map(i=>ty[i])),pr=x=>1/(1+Math.exp(-feat(x).reduce((s,v,q)=>s+v*w[q],0)));res[m][k]+=te.filter((x,i)=>(pr(x)>.5?1:0)==tey[i]).length/te.length/T;
if(k<B)for(let n=0;n<3;n++){let b=-1,bs=9;if(m=='a')tr.forEach((x,i)=>{if(!used.has(i)){const u=Math.abs(pr(x)-.5);if(u<bs){bs=u;b=i}}});else do{b=Math.floor(r()*300)}while(used.has(b));used.add(b);idx.push(b)}}}}return res}
function ses(tau,pre){const r=rng(9),T=pre?tau*1.5:tau,out=[];for(let b=0;b<8;b++){let c=0,k=0,o=0,nc=0,rt=0,ev=0;for(let i=0;i<20;i++){const a=Math.exp(-(b*20+i)/T),isC=r()<.2;rt+=8+32*a;ev+=r()<.15+.7*a?1:0;if(isC){c++;if(r()<.97*a)k++}else{nc++;if(r()<.12*a)o++}}out.push({b:b+1,c,det:c?k/c:0,ov:o/nc,rt:rt/20,ev:ev/20})}return out}
let AL=null;
function pgHuman(){AL=AL||runAL();const B=24,lab=k=>12+3*k,tgt=AL.r[B]-.005,ka=AL.a.findIndex(v=>v>=tgt),kr=AL.r.findIndex(v=>v>=tgt);
$('#app').innerHTML=tag(['P1','active sample selection §5, RL/labeling loop'],['P5','canaries, pre-commitment, behavioral monitoring'],['P4','escalation to human'])+`<h1>Human Loop</h1>
<h2>A. Who gets asked to label? (P1)</h2><p class="mu">Uncertainty sampling vs random labeling on a noisy XOR-style task. Logistic regression, 12 seed labels, +3 per round, 8 averaged trials, 200 held-out points; computed in your browser.</p>
<div class="card"><canvas id="al" width="620" height="240"></canvas><div class="kp" style="margin-top:8px"><div><b>${pc(AL.a[B])}</b><span>active @ ${lab(B)} labels</span></div><div><b>${pc(AL.r[B])}</b><span>random @ ${lab(B)} labels</span></div><div><b>${ka<0?'n/a':lab(ka)+' vs '+lab(kr)}</b><span>labels to reach ${pc(tgt)}</span></div><div><b>${ka<0?'n/a':pc(1-lab(ka)/lab(kr))}</b><span>human effort saved</span></div></div><p class="mu">Green = uncertainty sampling, grey = random.</p></div>
<h2>B. Does the human stay vigilant? (P5)</h2><p class="mu">Reviewer attention decays as exp(−t/τ) over 160 approvals; 20% of tasks are canaries where the agent is deliberately wrong. Decay model and the ×1.5 pre-commitment effect are modeling assumptions, not measurements from the paper.</p>
<div class="card"><label>Attention time constant τ: <b id="tau"></b> tasks</label><input id="tr" type="range" min="20" max="200" value="80" oninput="runS()"><label><input type="checkbox" id="pre" onchange="runS()"> Pre-commitment (user answers first, τ × 1.5)</label><canvas id="ss" width="620" height="220" style="margin-top:8px"></canvas><div class="tb" id="st"></div></div>`;
plot($('#al'),[{c:col('--mu'),n:'random',d:AL.r},{c:col('--ac'),n:'active',d:AL.a}],.5,'labels: 12 → '+lab(B));runS()}
function runS(){const tau=+$('#tr').value,o=ses(tau,$('#pre').checked);$('#tau').textContent=tau;plot($('#ss'),[{c:col('--ac'),n:'canary detection',d:o.map(x=>x.det)},{c:col('--wn'),n:'evidence seeking',d:o.map(x=>x.ev)}],0,'block 1 → 8');
$('#st').innerHTML=`<table><tr><th>Block</th><th>Canaries</th><th>Detection</th><th>Override</th><th>Review time</th><th>Evidence seeking</th></tr>${o.map(x=>`<tr><td>${x.b}</td><td>${x.c}</td><td>${pc(x.det)}</td><td>${pc(x.ov)}</td><td>${f(x.rt,1)} s</td><td>${pc(x.ev)}</td></tr>`).join('')}</table>`}
/* ---- 6 AUDIT ---- */
function pgAudit(){$('#app').innerHTML=tag(['P3','multiple-testing gap §5.3'],['P5','canary pairs'])+`<h1>Forking-Paths Audit</h1><p class="mu">The pipeline generated ${H.length} hypotheses. Reporting only the winner hides the family size. This page applies Bonferroni and Benjamini–Hochberg corrections to every pair. Pairs with rainfall are canaries: any that pass uncorrected are false positives.</p><div class="card"><label>Significance level α: <b id="av"></b></label><input type="range" min="1" max="20" value="${G.alpha*100}" oninput="G.alpha=this.value/100;runA()"></div><div class="kp" id="ak"></div><div class="card tb" id="at"></div>`;runA()}
function runA(){const a=G.alpha,m=H.length,o=[...H].sort((x,y)=>x.p-y.p),cn=H.filter(h=>h.a==6||h.b==6);$('#av').textContent=a;
$('#ak').innerHTML=`<div><b>${f((1-Math.pow(1-a,m))*100,1)}%</b><span>chance of ≥1 false positive across ${m} tests</span></div><div><b>${f(a*m,2)}</b><span>expected false positives if all null</span></div><div><b>${H.filter(h=>h.p<a).length}</b><span>raw significant</span></div><div><b>${H.filter(h=>h.bf<a).length}</b><span>Bonferroni</span></div><div><b>${H.filter(h=>h.q<a).length}</b><span>BH</span></div><div><b>${cn.filter(h=>h.p<a).length}/${cn.length}</b><span>canaries falsely flagged (raw)</span></div>`;
$('#at').innerHTML=`<table><tr><th>#</th><th>Hypothesis</th><th>n</th><th>r</th><th>raw p</th><th>Bonf p</th><th>BH q</th><th>Verdict</th></tr>${o.map((h,i)=>`<tr><td>${i+1}</td><td>${name(h)}${h.a==6||h.b==6?' 🐤':''}</td><td>${h.n}</td><td>${f(h.r,3)}</td><td>${pf(h.p)}</td><td>${pf(h.bf)}</td><td>${pf(h.q)}</td><td>${h.q<a?'survives BH':h.p<a?'<span class="wn">raw only</span>':'null'}</td></tr>`).join('')}</table>`}
/* ---- 7 PAPERS ---- */
function pgPapers(){const M=[['P1','Human-in-the-Loop ML Survey','2108.00941','Human Loop §A: uncertainty sampling vs random labeling'],['P2','Agentic AI Taxonomy','2601.12560','Garden planting loop; Planner Lab: ReAct / ToT / ReAcTree'],['P3','HLER Multi-Agent Economic Research','2603.07444','Profiler, Review Board rubric, Audit (multiple testing)'],['P4','Human-on-the-Loop Legal Discovery','2606.19812','Review Board entropy gate; wilted plants'],['P5','AI Agents Push Humans Out of the Loop','2608.23642','Human Loop §B: canaries, decay, behavioral signals, pre-commitment']];
$('#app').innerHTML=`<h1>Papers → Pages</h1><p class="mu">Every number on this site is computed live in your browser from a seeded synthetic dataset or simulation. Only the 41%→87% feasibility figure is quoted from a paper (P3).</p><div class="card tb"><table><tr><th></th><th>Paper</th><th>arXiv</th><th>Used in</th></tr>${M.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</table></div>`}
let hum=null,AU=null;
function setSnd(on){if(on){AU=AU||new(window.AudioContext||window.webkitAudioContext)();hum=[110,164.8,220].map((fq,i)=>{const o=AU.createOscillator(),gn=AU.createGain();o.frequency.value=fq;gn.gain.value=.018/(i+1);o.connect(gn).connect(AU.destination);o.start();return o})}else if(hum){hum.forEach(o=>o.stop());hum=null}$('#snd').textContent=hum?'♪ Sound on':'♪ Sound off'}
function chime(fq){if(!hum)return;const o=AU.createOscillator(),gn=AU.createGain(),t=AU.currentTime;o.frequency.value=fq;gn.gain.setValueAtTime(.08,t);gn.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(gn).connect(AU.destination);o.start();o.stop(t+1.5)}
(function(){let seen=0;try{seen=sessionStorage.getItem('hg')}catch(e){}if(seen)return;const d=document.createElement('div');d.id='intro';d.innerHTML=`<div><h1>Hypothesis Garden</h1><p>${H.length} hypotheses were planted in a synthetic dataset. ${H.filter(x=>x.q<G.alpha).length} survive correction for multiple testing. The rest are noise, wilted, or traps. Walk the garden, then audit it.</p><button>Enter the garden</button><button class="g">Enter with sound</button></div>`;document.body.appendChild(d);
d.onclick=e=>{if(e.target.tagName!='BUTTON')return;if(e.target.className=='g')setSnd(true);try{sessionStorage.setItem('hg',1)}catch(x){}d.classList.add('out');setTimeout(()=>d.remove(),700)}})();
route();
